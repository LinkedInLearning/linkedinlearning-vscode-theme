name: Publish theme

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string
      registry:
        description: Registry to publish to
        required: true
        default: open-vsx
        type: choice
        options: [open-vsx, marketplace, both]

permissions:
  contents: read

concurrency:
  group: publish-theme
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    uses: ./.github/workflows/ci.yml
    with:
      expected-version: ${{ inputs.version || '' }}
      release-tag: ${{ github.event.release.tag_name || '' }}
      publish-ref: ${{ github.ref }}

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: theme-vsix
      - run: sha256sum --check theme.vsix.sha256
      - name: Check Open VSX namespace ownership
        if: github.event_name == 'release' || inputs.registry != 'marketplace'
        run: |
          node --input-type=module -e '
            const response = await fetch("https://open-vsx.org/api/linkedinlearning");
            if (!response.ok) throw new Error(`Namespace lookup failed: ${response.status}`);
            const namespace = await response.json();
            if (namespace.verified !== true) throw new Error("Open VSX namespace ownership is not approved yet.");
          '
      - name: Publish to VS Code Marketplace using trusted publishing
        if: github.event_name == 'release' || inputs.registry != 'open-vsx'
        run: npm exec --no -- vsce publish --packagePath theme.vsix --oidc
      - name: Publish the same VSIX to Open VSX
        if: github.event_name == 'release' || inputs.registry != 'marketplace'
        run: npm exec --no -- ovsx publish theme.vsix --trusted-publishing
